<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Gym floor" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#00d2a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#g)"/>
  <rect x="0" y="0" width="1200" height="260" fill="#0f172a" opacity="0.6"/>
  <rect x="80" y="120" width="1040" height="28" rx="14" fill="url(#neon)" filter="url(#blur)" opacity="0.55"/>

  <!-- simple perspective grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <path d="M140 820 L600 340 L1060 820" fill="none"/>
    <path d="M220 820 L600 420 L980 820" fill="none"/>
    <path d="M300 820 L600 500 L900 820" fill="none"/>
    <path d="M380 820 L600 580 L820 820" fill="none"/>
    <path d="M460 820 L600 660 L740 820" fill="none"/>
    <path d="M540 820 L600 740 L660 820" fill="none"/>
    <path d="M220 740 L980 740"/>
    <path d="M300 660 L900 660"/>
    <path d="M380 580 L820 580"/>
    <path d="M460 500 L740 500"/>
    <path d="M520 420 L680 420"/>
  </g>

  <!-- equipment blocks -->
  <g fill="#ffffff" opacity="0.12">
    <rect x="110" y="520" width="160" height="260" rx="18"/>
    <rect x="940" y="520" width="160" height="260" rx="18"/>
    <rect x="330" y="430" width="160" height="350" rx="18"/>
    <rect x="710" y="430" width="160" height="350" rx="18"/>
  </g>

  <g fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="800" opacity="0.9">
    <text x="80" y="830" font-size="44">PREMIUM GYMS</text>
  </g>
</svg>
