<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-label="Strength training" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2d2a"/>
    </linearGradient>
    <radialGradient id="spot" cx="30%" cy="25%" r="70%">
      <stop offset="0" stop-color="#00d2a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00d2a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="75%" cy="70%" r="70%">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="360" cy="360" r="520" fill="url(#spot)" filter="url(#soft)"/>
  <circle cx="980" cy="1240" r="520" fill="url(#spot2)" filter="url(#soft)"/>

  <!-- dumbbell silhouette -->
  <g transform="translate(180 700)" opacity="0.92">
    <rect x="160" y="-50" width="680" height="100" rx="50" fill="#e6eefc" opacity="0.82"/>
    <rect x="80" y="-160" width="110" height="320" rx="28" fill="#ffffff" opacity="0.88"/>
    <rect x="10" y="-210" width="90" height="420" rx="28" fill="#ffffff" opacity="0.72"/>
    <rect x="1010" y="-210" width="90" height="420" rx="28" fill="#ffffff" opacity="0.72"/>
    <rect x="920" y="-160" width="110" height="320" rx="28" fill="#ffffff" opacity="0.88"/>
  </g>

  <g fill="#ffffff" opacity="0.88" font-family="ui-sans-serif, system-ui" font-weight="800" letter-spacing="1">
    <text x="90" y="1260" font-size="56">TRAIN STRONG</text>
    <text x="90" y="1338" font-size="26" opacity="0.75">Strength • Conditioning • Functional</text>
  </g>
</svg>
