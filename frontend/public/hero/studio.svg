<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Studio workout" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f2a24"/>
    </linearGradient>
    <radialGradient id="r" cx="30%" cy="30%" r="60%">
      <stop offset="0" stop-color="#00d2a0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d2a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r2" cx="80%" cy="70%" r="60%">
      <stop offset="0" stop-color="#2d6cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2d6cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="340" cy="280" r="420" fill="url(#r)" filter="url(#soft)"/>
  <circle cx="980" cy="680" r="420" fill="url(#r2)" filter="url(#soft)"/>

  <!-- abstract yoga figure -->
  <g transform="translate(580 420)" opacity="0.86" fill="#ffffff">
    <circle cx="0" cy="-150" r="44" opacity="0.9"/>
    <path d="M-16 -92 Q0 -130 16 -92 L40 -10 Q50 30 10 36 L-10 36 Q-50 30 -40 -10 Z" opacity="0.9"/>
    <path d="M-120 10 Q0 -40 120 10" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="26" stroke-linecap="round"/>
    <path d="M-74 120 Q0 60 74 120" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="26" stroke-linecap="round"/>
  </g>

  <g fill="#ffffff" font-family="ui-sans-serif, system-ui" font-weight="900" opacity="0.9">
    <text x="70" y="830" font-size="42">STUDIO & WELLNESS</text>
  </g>
</svg>
